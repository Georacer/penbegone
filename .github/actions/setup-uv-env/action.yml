name: "setup-uv-env"
description: "Composite action to set up uv and the Python environment."

inputs:
  python-version:
    required: false
    description: "The python version to use"
    default: "3.15"

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked
      shell: bash
