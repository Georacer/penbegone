[project]
name = "penbegone"
version = "0.0.1"
description = "Take your math from the paper to the screen"
authors = [{ name = "George Zogopoulos", email = "ftailwhipx4@gmail.com" }]
requires-python = ">=3.10,<4.0"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "sympy>=1.13.0,<2",
    "ipython>=8.26.0,<9",
    "matplotlib>=3.9.1,<4",
]

[project.urls]
Repository = "https://github.com/Georacer/penbegone"
Documentation = "https://Georacer.github.io/penbegone/"

[dependency-groups]
dev = [
    "pytest>=7.2.0,<8",
    "pytest-cov>=4.0.0,<5",
    "deptry>=0.12.0,<0.13",
    "mypy>=1.5.1,<2",
    "pre-commit>=3.4.0,<4",
    "tox>=4.11.1,<5",
    "tox-uv>=1.25",
]
docs = [
    "mkdocs>=1.4.2,<2",
    "mkdocs-material>=9.2.7,<10",
    "mkdocstrings[python]>=0.23.0,<0.24",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = ["penbegone"]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.mypy]
files = ["penbegone"]
disallow_untyped_defs = "True"
disallow_any_unimported = "True"
no_implicit_optional = "True"
check_untyped_defs = "True"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py37"
line-length = 120
fix = true
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["penbegone"]


[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]
