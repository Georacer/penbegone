site_name: penbegone
repo_url: https://github.com/Georacer/penbegone
site_url: https://Georacer.github.io/penbegone
site_description: Take your math from the paper to the screen
site_author: George Zogopoulos
edit_uri: edit/main/docs/
repo_name: Georacer/penbegone
copyright: Maintained by <a href="https://Georacer.com">Florian</a>.

nav:
  - Home: index.md
  - Modules: modules.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
            setup_commands:
                - import sys
                - sys.path.append('../')
theme:
  name: material
  feature:
    tabs: true
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Georacer/penbegone
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/penbegone

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
